<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <radialGradient id="favAura" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080C18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo escuro sagrado com cantos arredondados -->
  <rect width="64" height="64" rx="16" fill="#080C18"/>
  <rect width="64" height="64" rx="16" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Halo de luz suave -->
