  <circle cx="32" cy="32" r="23" stroke="url(#favGold)" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.6"/>

  <!-- Pomba Sagrada estilizada em ouro nobre -->
  <g transform="translate(2, 2)">
    <path d="M30 14C23 14 13 21 13 31C13 36 17 40 22 43C20 46 16 48 13 50C18 50 25 47 28 44.5C29 44.8 30 45 30 45C37 45 47 38 47 31C47 21 37 14 30 14Z" fill="url(#favGold)"/>
    <circle cx="24" cy="27" r="1.5" fill="#080C18"/>
    <!-- Ramo de Oliveira / Raio de Luz -->
    <path d="M30 14L37 8L34 17" stroke="url(#favGold)" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Pequeno brilho celestial -->
    <path d="M42 20L43 17L44 20L47 21L44 22L43 25L42 22L39 21Z" fill="#FFF8DC"/>
